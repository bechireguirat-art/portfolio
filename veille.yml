name: Portfolio et veille quotidienne

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le portfolio
        uses: actions/checkout@v6
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Sélectionner une actualité et construire le site
        run: python3 scripts/update_veille.py
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier le portfolio
        id: deployment
        uses: actions/deploy-pages@v4
